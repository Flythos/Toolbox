<div id="toolboxPanel">
    <div id="toolboxPanelheader" class="tb-titlebar">
        <i class="fa-solid fa-toolbox"></i>
        <span class="tb-title">Toolbox</span>
        <div class="tb-titlebar-actions">
            <div id="tbOpenSettings" class="menu_button" title="Toolbox settings"><i class="fa-solid fa-gear"></i></div>
            <div id="tbMinimize" class="menu_button" title="Minimize"><i class="fa-solid fa-window-minimize"></i></div>
            <div id="tbClose" class="menu_button" title="Close"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="drag-grabber"></div>
    </div>
    <div class="tb-body">
        <div id="tbGrid" class="tb-grid"></div>
        <div id="tbEmpty" class="tb-empty tb-hidden">
            Toolbox is empty.<br>
            Open the settings (<i class="fa-solid fa-gear"></i>) and flip tools to
            "in toolbox" — they leave the hamburger / wand menus and live here.
        </div>
    </div>
</div>
